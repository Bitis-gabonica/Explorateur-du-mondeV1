<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Résultat - World Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
  <div class="max-w-lg mx-auto p-6">
    <div class="bg-white rounded-xl shadow p-6 relative">
      <div class="absolute top-4 right-4">
        {% if result %}
          <div class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm">✅ Bonne réponse !</div>
        {% else %}
          <div class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm">❌ Mauvaise réponse !</div>
        {% endif %}
      </div>
      <div class="mt-6">
        {% if not result %}
          <p class="text-lg">La bonne réponse était : <strong>{{ correct }}</strong></p>
        {% endif %}
        <div class="mt-6 flex gap-4">
          <a href="/quiz" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Refaire un quiz</a>
          <a href="/" class="px-4 py-2 bg-gray-300 text-black rounded hover:bg-gray-400">Retour</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
